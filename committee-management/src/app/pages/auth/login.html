<div class="auth-page">
  <div class="auth-card">
    <p class="eyebrow">Committee Management</p>
    <h1>Sign In</h1>
    <p class="card-copy">Use your account to continue where you left off.</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
        />
      </div>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <button type="submit" [disabled]="isLoading" class="submit-button">
        {{ isLoading ? 'Signing In...' : 'Sign In' }}
      </button>
    </form>

    <p class="auth-link">
      Don't have an account?
      <a routerLink="/signup">Sign Up</a>
    </p>
  </div>
</div>
